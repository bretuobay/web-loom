name: Bundle Size Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/ui-core/**'
      - 'packages/ui-patterns/**'
  push:
    branches: [main, develop]
    paths:
      - 'packages/ui-core/**'
      - 'packages/ui-patterns/**'

jobs:
  check-bundle-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Rollup native binaries work reliably on Node 20 & 22, NOT 23
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Install workspace dependencies (frozen lockfile)
      - name: Clean install
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile

      # Ensure Vite and build dependencies are properly resolved
      - name: Rebuild build dependencies
        run: |
          pnpm --filter @web-loom/ui-core rebuild
          pnpm --filter @web-loom/ui-patterns rebuild

      - name: Build packages
        run: |
          pnpm --filter @web-loom/ui-core run build
          pnpm --filter @web-loom/ui-patterns run build

      - name: Test tree-shaking for ui-core
        run: pnpm --filter @web-loom/ui-core run test:tree-shaking

      - name: Test tree-shaking for ui-patterns
        run: pnpm --filter @web-loom/ui-patterns run test:tree-shaking

      - name: Check bundle size limits
        run: |
          echo "Checking bundle size requirements..."

          # This will be implemented by the tree-shaking test scripts
          # which will exit with non-zero if size limits are exceeded

          echo "✅ Bundle size checks passed!"

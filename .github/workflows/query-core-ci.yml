# .github/workflows/query-core-ci.yml

name: CI - @web-loom/query-core
on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/query-core/**'

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rollup native binaries work reliably on Node 20 & 22, NOT 23
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Install workspace dependencies (frozen lockfile)
      - name: Clean install
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile

      # Ensure Vite and build dependencies are properly resolved
      - name: Rebuild build dependencies
        run: pnpm --filter @web-loom/query-core rebuild

      - name: Run tests for @web-loom/query-core
        run: pnpm --filter @web-loom/query-core test
      - name: Build @web-loom/query-core
        run: pnpm exec turbo run build --filter=@web-loom/query-core

      - name: Upload build artifacts (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: query-core-dist-build-artifacts
          path: packages/query-core/dist/

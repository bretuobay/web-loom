# .github/workflows/mcp-server-ci.yml

name: CI - @web-loom/mcp-server
on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/mcp-server/**'

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Clean install
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile

      - name: Type check @web-loom/mcp-server
        run: pnpm --filter @web-loom/mcp-server run check-types

      - name: Build @web-loom/mcp-server
        run: pnpm exec turbo run build --filter=@web-loom/mcp-server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-dist-build-artifacts
          path: packages/mcp-server/dist/
